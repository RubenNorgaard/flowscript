<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowScript View</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b1f24; --muted: #667080; --line: #e2e5ea;
  --accent: #2f6fde; --ok: #1f9d55; --warn: #b8720a; --err: #d1383d; --flash: #fff1b8;
  --spark: #2f6fde; --mark: #d1383d;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --fg: #e6e9ee; --muted: #8a94a3; --line: #262c35;
    --accent: #6b9cff; --ok: #3ccf7e; --warn: #f0b04a; --err: #ff6b6f; --flash: #4a3f12;
    --spark: #6b9cff; --mark: #ff6b6f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.spacer { flex: 1; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.bad { color: var(--err); border-color: currentColor; }
.banner { margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--err);
  color: var(--err); background: var(--panel); font-size: 13px; }
.timeline { display: flex; align-items: center; gap: 12px; padding: 12px 20px 0; flex-wrap: wrap; }
.timeline input[type=range] { flex: 1; min-width: 200px; accent-color: var(--accent); }
.timeline .at { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 210px; }
button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.on { border-color: var(--accent); color: var(--accent); }
main { display: grid; gap: 16px; padding: 14px 20px 24px; max-width: 1600px; margin: 0 auto;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .timeline, header { padding-left: 16px; padding-right: 16px; } .banner { margin: 12px 16px 0; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap;
  text-transform: none; letter-spacing: 0; font-weight: 400; }
.span2 { grid-column: 1 / -1; }
.state { font-size: 30px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
.svgbox { margin-top: 10px; overflow: auto; }
.svgbox svg { display: block; margin: 0 auto; }
.empty { color: var(--muted); font-style: italic; }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.k { color: var(--muted); }
td.t { color: var(--muted); font-size: 11px; width: 1%; }
td.v { word-break: break-all; transition: background .8s; }
td.v.flash { background: var(--flash); transition: none; }
td.s { width: 130px; }
td.s svg { display: block; width: 130px; height: 24px; }
.ev { font-family: var(--mono); font-size: 12px; max-height: 420px; overflow: auto; margin: 0; padding: 0; list-style: none; }
.ev li { padding: 2px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-all; }
.ev .tm { color: var(--muted); margin-right: 8px; }
.ev .k { display: inline-block; min-width: 58px; margin-right: 6px; font-size: 11px; color: var(--muted); }
.ev .log .k { color: var(--accent); } .ev .fault .k, .ev .error .k { color: var(--err); }
.ev .event .k { color: var(--ok); } .ev .call .k { color: var(--warn); }
.ev .handler .k { color: var(--fg); }
.ev .text { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">FlowScript view <small id="sub"></small></h1>
  <span class="spacer"></span>
  <span class="pill" id="mode" title="monitor: the device sends what happens; replay: its inputs, re-run here">–</span>
  <span class="pill" id="input">–</span>
  <span class="pill" id="sync">connecting…</span>
  <span class="pill" id="count">0 frames</span>
</header>
<div class="banner" id="banner" hidden></div>
<div class="timeline">
  <input type="range" id="slider" min="0" max="0" value="0" aria-label="timeline">
  <button id="follow" class="on" title="follow the newest point">● Live</button>
  <span class="at" id="at">–</span>
</div>
<main>
  <section class="card">
    <h2>State</h2>
    <div class="state" id="state">–</div>
    <div class="svgbox" id="states"></div>
  </section>
  <section class="card">
    <h2>Variables</h2>
    <table id="vars"><tbody></tbody></table>
  </section>
  <section class="card span2">
    <h2>Events <span class="tools" id="filters"></span></h2>
    <ul class="ev" id="events"></ul>
  </section>
  <section class="card span2" id="flowcard">
    <h2>Flowchart <span class="tools"><button id="showflow">show</button></span></h2>
    <div class="svgbox" id="flow" hidden></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KINDS = ["handler", "log", "fault", "error", "event", "call", "text"];
let meta = null, points = [], pbase = 0, events = [], ebase = 0, version = 0;
let sel = -1, follow = true, shownState, shownFlow, showFlow = false, lastVals = [];
const filter = {}; KINDS.forEach(k => filter[k] = true);
try { Object.assign(filter, JSON.parse(localStorage.getItem("fsview.filter") || "{}")); } catch (e) {}

function fmtT(t, frame) {
  if (t == null) return `frame ${frame}`;
  const d = new Date(t);
  return d.toLocaleTimeString([], {hour12: false}) + "." + String(d.getMilliseconds()).padStart(3, "0");
}

function num(text, type) {
  if (type !== "int" && type !== "float") return null;
  const v = parseFloat(text);
  return isFinite(v) ? v : null;
}

function spark(i, type) {
  if (type !== "int" && type !== "float" || points.length < 2) return "";
  const n = points.length, step = Math.max(1, Math.floor(n / 240));
  const xs = [], ys = [];
  for (let j = 0; j < n; j += step) { const v = num(points[j][3][i], type); if (v != null) { xs.push(j); ys.push(v); } }
  if (xs[xs.length - 1] !== n - 1) { const v = num(points[n - 1][3][i], type); if (v != null) { xs.push(n - 1); ys.push(v); } }
  if (ys.length < 2) return "";
  let lo = Math.min(...ys), hi = Math.max(...ys); if (lo === hi) { lo -= 1; hi += 1; }
  const X = j => (j / (n - 1) * 126 + 2).toFixed(1), Y = v => (22 - (v - lo) / (hi - lo) * 20).toFixed(1);
  const d = xs.map((x, k) => (k ? "L" : "M") + X(x) + "," + Y(ys[k])).join("");
  const sv = num(points[sel][3][i], type);
  const mark = sv == null ? "" : `<circle cx="${X(sel)}" cy="${Y(sv)}" r="2.5" fill="var(--mark)"/>`;
  return `<svg viewBox="0 0 130 24" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--spark)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>${mark}</svg>`;
}

async function loadSvg(el, view, state) {
  const r = await fetch(`/svg?view=${view}&state=${encodeURIComponent(state || "")}`);
  el.innerHTML = r.ok ? await r.text() : `<p class="empty">${esc(await r.text())}</p>`;
}

function renderHeader() {
  $("sub").textContent = `${meta.name} · ${meta.file}` + (meta.device ? ` · device: ${meta.device}` : "");
  $("mode").textContent = meta.mode || "no frames yet";
  $("mode").hidden = !meta.mode;
  $("input").textContent = meta.live ? (meta.eof ? `${meta.input} · ended` : `● ${meta.input}`) : `${meta.input} · file`;
  $("input").className = "pill " + (meta.live && !meta.eof ? "ok" : "");
  $("sync").textContent = meta.joined ? "in sync" : "waiting for START / keyframe";
  $("sync").className = "pill " + (meta.joined ? "ok" : "warn");
  $("count").textContent = `${meta.frames} frames · ${points.length + pbase} points` + (meta.bad ? ` · ${meta.bad} damaged` : "");
  const errs = events.filter(e => e[2] === "error");
  const last = errs[errs.length - 1];
  const msgs = [...meta.notes];
  if (!meta.joined && last) msgs.push(last[3]);
  $("banner").hidden = !msgs.length;
  $("banner").textContent = msgs.join(" · ");
  $("flowcard").hidden = !meta.has_source;
}

function render() {
  renderHeader();
  const n = points.length;
  $("slider").max = Math.max(0, n - 1);
  if (follow || sel >= n) sel = n - 1;
  $("slider").value = Math.max(0, sel);
  $("follow").className = follow ? "on" : "";
  if (sel < 0) { $("at").textContent = meta.joined ? "–" : "no data yet"; renderEvents(); return; }
  const p = points[sel];
  $("at").textContent = `${fmtT(p[0], p[1])} · point ${sel + 1 + pbase} of ${n + pbase}`;

  if (p[2] !== shownState) {
    shownState = p[2];
    $("state").textContent = p[2] || "–";
    if (meta.has_source) loadSvg($("states"), "states", p[2]);
  }
  if (showFlow && p[2] !== shownFlow) { shownFlow = p[2]; loadSvg($("flow"), "flow", p[2]); }

  const tb = $("vars").tBodies[0];
  meta.globals.forEach((g, i) => {
    let row = tb.rows[i];
    if (!row) {
      row = tb.insertRow();
      ["k", "t", "v", "s"].forEach(c => row.insertCell().className = c);
      row.cells[0].textContent = g.name; row.cells[1].textContent = g.type;
    }
    const v = p[3][i];
    if (lastVals[i] !== v) {
      row.cells[2].textContent = v;
      if (lastVals[i] !== undefined) { row.cells[2].classList.add("flash"); setTimeout(() => row.cells[2].classList.remove("flash"), 50); }
      lastVals[i] = v;
    }
    row.cells[3].innerHTML = spark(i, g.type);
  });
  renderEvents();
}

function renderEvents() {
  const upTo = sel < 0 ? Infinity : sel + pbase;
  const list = [];
  for (let j = events.length - 1; j >= 0 && list.length < 400; j--) {
    const e = events[j];
    if (e[0] <= upTo && filter[e[2]]) list.push(e);
  }
  list.reverse();
  const el = $("events");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  el.innerHTML = list.length ? list.map(e => `<li class="${e[2]}"><span class="tm">${fmtT(e[1], "")}</span><span class="k">${e[2]}</span>${esc(e[3])}</li>`).join("")
                             : `<li class="empty">nothing yet</li>`;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function renderFilters() {
  $("filters").innerHTML = KINDS.map(k => `<button data-k="${k}" class="${filter[k] ? "on" : ""}">${k}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => {
    filter[b.dataset.k] = !filter[b.dataset.k];
    try { localStorage.setItem("fsview.filter", JSON.stringify(filter)); } catch (e) {}
    renderFilters(); renderEvents();
  });
}

$("slider").oninput = () => { sel = +$("slider").value; follow = sel === points.length - 1; render(); };
$("follow").onclick = () => { follow = true; render(); };
$("showflow").onclick = () => {
  showFlow = !showFlow; shownFlow = undefined;
  $("flow").hidden = !showFlow; $("showflow").textContent = showFlow ? "hide" : "show";
  render();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    if (e.target === $("slider")) return;
    sel = Math.max(0, Math.min(points.length - 1, sel + (e.key === "ArrowLeft" ? -1 : 1)));
    follow = sel === points.length - 1; render(); e.preventDefault();
  }
});

async function poll() {
  for (;;) {
    try {
      const r = await fetch(`/data?p=${pbase + points.length}&e=${ebase + events.length}&v=${version}&wait=${meta ? 1 : 0}`);
      const d = await r.json();
      meta = d.meta; version = d.version;
      if (d.pbase > pbase + points.length) { points = []; pbase = d.pbase; }      // dropped: start over there
      if (d.ebase > ebase + events.length) { events = []; ebase = d.ebase; }
      points.push(...d.points); events.push(...d.events);
      const dropP = points.length - 50000, dropE = events.length - 20000;   // as the server keeps
      if (dropP > 0) { points.splice(0, dropP); pbase += dropP; sel -= dropP; }
      if (dropE > 0) { events.splice(0, dropE); ebase += dropE; }
      render();
    } catch (err) {
      $("sync").textContent = "viewer stopped"; $("sync").className = "pill bad";
      await new Promise(res => setTimeout(res, 2000));
    }
  }
}
renderFilters();
poll();
</script>
</body>
</html>
